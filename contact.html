<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Contact FF Rohman for networking, CCNA preparation, ISP networking, and junior IT opportunities.">
    <title>Contact | FF Rohman</title>
    <link rel="icon" type="image/png" href="assets/img/favicon.png">
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>
  <body>
    <div class="site-shell">
      <div data-component="navbar"></div>

      <main id="main-content" class="page">
        <section class="section page-hero reveal">
          <!-- <p class="eyebrow">contact.sh</p> -->
          <h1>Contact</h1>
          <p>Use the form or connect through email and LinkedIn.</p>
        </section>

        <section class="section contact-layout reveal">
          <form class="contact-form" action="https://formspree.io/f/xyklazdo" method="POST">
            <label>
              Name
              <input type="text" name="name" autocomplete="name" required>
            </label>
            <label>
              Email
              <input type="email" name="email" autocomplete="email" required>
            </label>
            <label>
              Message
              <textarea name="message" rows="6" required></textarea>
            </label>
            <button class="button button--primary" type="submit">Send message</button>
            <!-- <p class="form-note">Replace the Formspree action URL with your own endpoint before publishing.</p> -->
          </form>

          <aside class="contact-card">
            <h2>Social links</h2>
            <a href="https://github.com/ffrohman" target="_blank">GitHub</a>
            <a href="https://www.linkedin.com/in/ffrohman/" target="_blank">LinkedIn</a>
            <a href="https://www.facebook.com/FayajurRohmanFayaj/" target="_blank">Facebook</a>
            <a href="https://www.instagram.com/ff_rohman36/" target="_blank">instragram</a>
            <a href="mailto:contact@ffrohman.com" target="_blank">contact@ffrohman.com</a>
          </aside>
        </section>
      </main>

      <div data-component="footer"></div>
    </div>

    <script src="assets/js/main.js" defer></script>
  </body>
</html>
